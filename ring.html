<!DOCTYPE html>

<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Choose Our Ring 💍
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>

<div id="loader">

<div class="loader-heart">
💍
</div>

<p>
Preparing our story...
❤️
</p>

</div>



<audio id="bgMusic" autoplay loop>

<source src="./audio/bgm.mp3" type="audio/mp3">

</audio>




<div id="floating-container"></div>







<section class="ring-page">





<h1>

Choose Our Ring 💍

</h1>




<p>

Every ring has a story...

</p>







<div class="ring-choice">





<!-- Thum gives Phung -->

<div

class="ring-card"

onclick="chooseThumGive()">



<img

src="./images/rings/ring-phung.png"

alt="Ring for Phung">



<h2>

Thum ❤️ Phung

</h2>



<p>

A ring from Thum to Phung

</p>



</div>








<!-- Phung gives Thum -->


<div

class="ring-card"

onclick="choosePhungGive()">



<img

src="./images/rings/ring-thum.png"

alt="Ring for Thum">



<h2>

Phung ❤️ Thum

</h2>



<p>

A ring from Phung to Thum

</p>



</div>





</div>







<!-- Password Area -->


<div

id="unlock-area">


</div>







<!-- Ring Reveal Area -->


<div
id="ring-box-area">

<div class="ring-intro">

<p>
Your special moment is waiting... 💍
</p>

</div>

</div>








<!-- Next Button Hidden -->

<button

id="nextLetter"

style="display:none"

onclick="goLetter()">



💌 Open Love Letter



</button>






</section>







<script src="script.js"></script>



</body>


</html>
