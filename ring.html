<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Our Promise Rings 💍
</title>


<link rel="stylesheet" href="./style.css">


</head>



<body>



<audio id="bgMusic" autoplay loop>

<source src="./audio/bgm.mp3" type="audio/mp3">

</audio>



<div id="floating-container"></div>




<section class="ring-page">



<h1>
Our Promise Rings 💍
</h1>



<h2>
28 April
</h2>



<p>
Two hearts, one promise
</p>




<div class="ring-choice">



<!-- THUM GIVES PHUNG -->

<div 
class="ring-card"
onclick="chooseThumGive()">



<img 
src="./images/rings/ring-box-closed.png"
alt="Thum gives ring">



<h2>
💍 Thum gives ring to Phung
</h2>



<p>
A promise from Thum to Phung
</p>


</div>





<!-- PHUNG GIVES THUM -->


<div 
class="ring-card"
onclick="choosePhungGive()">



<img 
src="./images/rings/ring-box-closed.png"
alt="Phung gives ring">



<h2>
💎 Phung gives ring to Thum
</h2>



<p>
A promise from Phung to Thum
</p>



</div>



</div>




<!-- Password / Story Area -->

<div id="unlock-area"></div>




<!-- Ring Box Animation Area -->

<div id="ring-box-area">

<div class="ring-light"></div>

</div>




<!-- Continue Button -->

<button

id="nextLetter"

onclick="goLetter()"

style="display:none;">


💌 Open Our Letter


</button>



</section>



<script src="./script.js"></script>



</body>


</html>
