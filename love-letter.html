<!DOCTYPE html>

<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Our Love Letter 💌
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div id="loader">

<div class="loader-heart">
💍
</div>

<p>
Preparing our story...
❤️
</p>

</div>




<audio id="bgMusic" autoplay loop>

<source src="./audio/bgm.mp3" type="audio/mp3">

</audio>




<div id="floating-container"></div>





<section class="letter-page">





<h1>
A Letter From My Heart 💌
</h1>






<div class="letter-container">





<!-- Closed Envelope -->

<img

id="envelopeImage"

src="./images/envelope/envelope-closed.png"

class="envelope"

alt="Closed Envelope">






<div class="heart-animation">


<img

src="./images/envelope/heart-sparkle.png"

class="heart-sparkle"

alt="Heart Sparkle">


<span>❤️</span>

<span>💗</span>

<span>✨</span>


</div>







<button onclick="openLetter()">

💌 Open Letter

</button>






</div>









<!-- Letter Content -->


<div

id="letterContent"

class="letter-content hidden">





<img

src="./images/envelope/letter-open.png"

class="open-letter"

alt="Open Letter">








<div class="typing-text">



<h2>
My Love ❤️
</h2>




<p id="loveText">

</p>



</div>









<h2>
I Love You
</h2>









<div class="languages fade-language">



<p>
Thailand — รักคุณ ❤️
</p>


<p>
English — I love you ❤️
</p>


<p>
Korean — 사랑해 ❤️
</p>


<p>
Japanese — 愛してる ❤️
</p>


<p>
Chinese — 我爱你 ❤️
</p>


<p>
Italian — Ti amo ❤️
</p>


<p>
French — Je t'aime ❤️
</p>


<p>
German — Ich liebe dich ❤️
</p>



</div>







<button onclick="goGift()">

🎁 Secret Gift

</button>






</div>






</section>







<script src="script.js"></script>



</body>


</html>
